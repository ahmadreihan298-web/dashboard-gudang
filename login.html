<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gudang Sistem</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon"><i data-feather="shield"></i></div>
      <h1>Gudang Sistem</h1>
      <p class="login-sub">Masuk untuk mengakses aplikasi</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="login-form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" placeholder="Masukkan username" required autocomplete="username" />
      </div>
      <div class="login-form-group">
        <label for="loginPassword">Password</label>
        <div class="pw-input-wrap">
          <input type="password" id="loginPassword" placeholder="Masukkan password" required autocomplete="current-password" />
          <button type="button" class="pw-toggle" data-pw-toggle aria-label="Tampilkan password"><i data-feather="eye"></i></button>
        </div>
      </div>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn-login" id="loginBtn"><i data-feather="log-in"></i> Masuk</button>
    </form>

    <p class="login-hint">Akun bawaan: admin / admin123</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="persistence.js"></script>
  <script src="login.js"></script>
  <script>
    feather.replace();
    if (isAuthenticated()) window.location.replace('hp.html');
  </script>
</body>

</html>
